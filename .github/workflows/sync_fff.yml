name: Synchronisation FFF vers PythonAnywhere

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer uniquement les librairies nécessaires
        run: pip install requests beautifulsoup4 urllib3

      - name: Exécuter la synchronisation FFF vers le Cloud
        run: python sync_to_cloud.py
